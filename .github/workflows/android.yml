name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Gradlew not found, installing gradle..."
          sudo apt-get update && sudo apt-get install -y gradle
          PROJECT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug
        else
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: S5GPT-App-Release
        path: '**/build/outputs/apk/debug/*.apk'
